<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AX 도입과 E2E Process Innovation을 5일 동안 혼자 학습하는 과정">
  <title>AX × E2E PI 개인 학습</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#learning-view">본문으로 건너뛰기</a>

  <header class="course-header">
    <a class="course-brand" href="#/home" aria-label="AX 개인 학습 홈">
      <span class="identity-mark" aria-hidden="true">
        <span class="origin-dot"></span>
        <span class="signal-line"></span>
        <span class="signal-node"></span>
      </span>
      <span><strong>AX × E2E PI</strong><small>SELF-PACED LEARNING</small></span>
    </a>
    <div class="header-progress">
      <label id="course-progress-text" for="course-progress">전체 진도 0%</label>
      <progress id="course-progress" max="100" value="0" aria-label="전체 학습 진도">0%</progress>
    </div>
  </header>

  <div class="app-shell">
    <aside class="course-rail" aria-label="과정 탐색">
      <nav id="day-navigation" aria-label="5일 학습 목차"></nav>
      <button id="reset-progress" class="button button-ghost" type="button">학습 기록 초기화</button>
    </aside>

    <main id="learning-view" tabindex="-1">
      <section id="study-home" aria-labelledby="home-title"></section>
      <article id="lesson-content" class="reading-column" aria-live="polite" hidden></article>
      <section id="quiz-panel" class="reading-column" aria-live="polite" hidden></section>
    </main>
  </div>

  <button id="continue-button" class="button button-primary floating-continue" type="button">이어서 학습</button>

  <dialog id="reset-dialog" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-description">
    <form method="dialog">
      <h2 id="reset-dialog-title">학습 기록을 초기화할까요?</h2>
      <p id="reset-dialog-description">완료한 레슨과 퀴즈 점수가 이 브라우저에서 모두 삭제됩니다.</p>
      <div class="dialog-actions">
        <button class="button button-secondary" type="submit" value="cancel">취소</button>
        <button class="button button-danger" type="submit" value="confirm">초기화</button>
      </div>
    </form>
  </dialog>

  <noscript>이 학습 앱을 사용하려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
